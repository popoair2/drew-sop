<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>drew-sop // asset-dashboard</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <!-- iOS full screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Drew-Sop">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="terminal-frame">

  <!-- PULL-TO-REFRESH INDICATOR -->
  <div id="pullIndicator" class="pull-indicator">
    <span class="pull-text">downloading data...</span>
  </div>

  <!-- BOOT SEQUENCE -->
  <div id="bootSequence" class="boot-sequence"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="header-line">
      <div class="terminal-prompt">
        <span class="prompt-user">root</span>@<span class="prompt-host">drew-sop</span>:<span style="color:var(--text-dim)">~#</span>
        <span style="margin-left:8px; color:var(--text-dim)">./asset-dashboard.sh</span>
        <span class="blink" style="margin-left:4px">█</span>
      </div>
      <div class="header-status">
        <div class="total-value-line">
          <span class="label">TOTAL_ASSET_VALUE_HKD</span>
          <span class="value" id="totalValue">—</span>
        </div>
        <button class="btn-pill btn-primary" id="btnAddAsset">+ add_asset</button>
      </div>
    </div>
  </header>

  <!-- CHANGE BAR -->
  <section class="change-bar" id="changeBar">
    <div class="change-item">
      <span class="change-label">1D</span>
      <span class="change-value" id="changeDay">—</span>
    </div>
    <div class="change-item">
      <span class="change-label">1M</span>
      <span class="change-value" id="changeMonth">—</span>
    </div>
    <div class="change-item">
      <span class="change-label">1Y</span>
      <span class="change-value" id="changeYear">—</span>
    </div>
    <div class="last-update">
      <span id="lastUpdate">waiting for data...</span>
    </div>
  </section>

  <!-- BENTO GRID -->
  <main class="bento-grid">

    <!-- PIE CHART CARD → NOW CLI BAR CHART -->
    <div class="bento-card card-pie">
      <div class="card-status"><span class="status-dot"></span> LIVE</div>
      <h2 class="card-title">持倉分佈 // ALLOCATION</h2>
      <div id="cliBarChart" class="cli-bar-chart"></div>
      <hr class="sep">
      <div class="category-legend" id="categoryLegend"></div>
    </div>

    <!-- LINE CHART CARD -->
    <div class="bento-card card-line">
      <div class="card-status"><span class="status-dot"></span> LIVE</div>
      <h2 class="card-title">資產走勢 // HISTORY</h2>
      <div class="period-switcher">
        <button class="period-btn" data-period="day" onclick="App.setPeriod('day')">1D</button>
        <button class="period-btn active" data-period="month" onclick="App.setPeriod('month')">1M</button>
        <button class="period-btn" data-period="year" onclick="App.setPeriod('year')">1Y</button>
      </div>
      <div class="chart-container">
        <canvas id="lineChart"></canvas>
      </div>
    </div>

    <!-- ASSET LIST BY CATEGORY -->
    <div class="bento-card card-assets" id="assetListCard">
      <div class="card-status"><span class="status-dot"></span> LOADED</div>
      <h2 class="card-title">持倉明細 // HOLDINGS</h2>
      <div id="assetList"></div>
    </div>

    <!-- SETTINGS CARD -->
    <div class="bento-card card-settings">
      <h2 class="card-title">系統管理 // SYSADMIN</h2>
      <div class="settings-group">
        <button class="btn-pill" id="btnManageCategories">manage_categories</button>
        <button class="btn-pill" id="btnRefreshPrices">force_refresh</button>
      </div>
    </div>

  </main>

  <!-- MODAL: ADD/EDIT ASSET -->
  <div class="modal-overlay" id="modalAsset">
    <div class="modal">
      <h2 class="modal-title" id="modalAssetTitle">add_asset</h2>
      <form id="formAsset">
        <div class="form-group">
          <label>ticker_symbol</label>
          <input type="text" id="inputSymbol" placeholder="e.g. AAPL, 0700.HK, BTC" required>
        </div>
        <div class="form-group form-group-search">
          <label>display_name</label>
          <input type="text" id="inputName" placeholder="search or enter name…" required autocomplete="off">
          <div class="search-dropdown" id="searchDropdown"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>asset_type</label>
            <select id="inputType">
              <option value="us_stock">US_STOCK</option>
              <option value="hk_stock">HK_STOCK</option>
              <option value="etf">US_ETF</option>
              <option value="hk_etf">HK_ETF</option>
              <option value="crypto">CRYPTO</option>
              <option value="forex">FOREX</option>
              <option value="cash">CASH</option>
            </select>
          </div>
          <div class="form-group">
            <label>category_id</label>
            <select id="inputCategory"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>quantity</label>
            <input type="number" id="inputQuantity" step="any" placeholder="0" required>
          </div>
          <div class="form-group">
            <label>currency</label>
            <select id="inputCurrency">
              <option value="USD">USD</option>
              <option value="HKD">HKD</option>
              <option value="JPY">JPY</option>
              <option value="EUR">EUR</option>
              <option value="CNY">CNY</option>
              <option value="GBP">GBP</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>dividend_yield_pct</label>
            <input type="number" id="inputDividendYield" step="0.01" min="0" max="100" placeholder="e.g. 2.50">
          </div>
          <div class="form-group"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-pill" id="btnCancelAsset">cancel</button>
          <button type="submit" class="btn-pill btn-primary">save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: MANAGE CATEGORIES -->
  <div class="modal-overlay" id="modalCategories">
    <div class="modal">
      <h2 class="modal-title">manage_categories</h2>
      <div id="categoryList"></div>
      <hr class="sep">
      <form id="formAddCategory" class="form-inline">
        <input type="text" id="inputCategoryName" placeholder="new category name" required>
        <input type="color" id="inputCategoryColor" value="#00FF41">
        <button type="submit" class="btn-pill btn_primary">add</button>
      </form>
      <div class="form-actions">
        <button class="btn-pill" id="btnCloseCategories">close</button>
      </div>
    </div>
  </div>

</div><!-- /terminal-frame -->

  <!-- Version: 15 — terminal UI -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/drew-sop/sw.js?v=15').then(reg => {
        reg.update();
      }).catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!sessionStorage.getItem('swReloaded')) {
          sessionStorage.setItem('swReloaded', '1');
          location.reload();
        }
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/utils.js?v=15"></script>
  <script src="js/storage.js?v=15"></script>
  <script src="js/api.js?v=15"></script>
  <script src="js/charts.js?v=15"></script>
  <script src="js/app.js?v=15"></script>
</body>
</html>
